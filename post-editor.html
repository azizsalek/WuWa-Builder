<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f5f9">
<title>محرر المشاركة · WuWa Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
:root{--cyan:#0891a5;--blue:#56b9d1;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--surface:#fff;--bg:#f1f5f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;gap:12px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#72d7e7,#8dbbff);display:grid;place-items:center;color:#102033}.top-actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#475569;padding:9px 15px;border-radius:9px;font:700 12px Cairo;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:linear-gradient(110deg,var(--cyan),var(--blue));border:0;color:white}.btn:disabled{opacity:.55;cursor:wait}.layout{max-width:1440px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.compose,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px #0f172a08}.compose{padding:22px;min-width:0}.title-input{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 2px 18px;font:700 29px Cairo;outline:0;color:var(--ink);background:transparent}.title-input::placeholder{color:#aab4c2}.toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:12px}.tool{width:35px;height:34px;border:0;border-radius:7px;background:transparent;color:#475569;cursor:pointer}.tool:hover,.tool.active{background:#e6f8fb;color:#087f93}.divider{height:22px;border-right:1px solid var(--line);margin:0 5px}.editor{min-height:560px;outline:0;padding:14px 5px;font:16px/2 Cairo;overflow-wrap:anywhere}.editor:empty:before{content:attr(data-placeholder);color:#aab4c2}.editor img{max-width:100%;height:auto;border-radius:9px}.editor table{border-collapse:collapse;width:100%}.editor td,.editor th{border:1px solid #cbd5e1;padding:8px}.html-source{width:100%;min-height:560px;border:0;outline:0;resize:vertical;direction:ltr;text-align:left;font:13px/1.7 monospace;padding:15px;background:#f8fafc;color:#334155}.hidden{display:none!important}.side{display:grid;align-content:start;gap:14px}.card{padding:16px}.card-head{font-size:13px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}.field{display:grid;gap:6px;margin-bottom:12px;color:#475569;font-size:11px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#f8fafc;font:12px Cairo;color:var(--ink);outline:0}.field textarea{resize:vertical}.hint{font-size:10px;color:#94a3b8;line-height:1.7}.status{font-size:11px;color:var(--muted);margin:0 0 10px}.message{font-size:11px;min-height:20px;color:var(--cyan);line-height:1.8}.message.error{color:#e11d48}.word-count{font-size:10px;color:#94a3b8;text-align:left}.overlay{position:fixed;inset:0;background:#0f172a99;z-index:20;display:grid;place-items:center;padding:18px}.preview{width:min(850px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:24px}.preview h1{font-size:26px}.preview-body{line-height:2;overflow-wrap:anywhere}.preview-body img{max-width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}.editor,.html-source{min-height:420px}}@media(max-width:600px){.top{height:auto;min-height:62px;padding:10px 12px;flex-wrap:wrap}.brand{font-size:12px}.top-actions{width:100%;justify-content:flex-end}.top-actions .btn{flex:1;padding:8px 6px;font-size:10px}.layout{margin:12px auto;padding:0 10px;gap:12px}.compose{padding:13px}.title-input{font-size:22px}.side{grid-template-columns:1fr}.editor,.html-source{min-height:350px;font-size:14px}.toolbar{gap:2px}.tool{width:32px;height:32px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/admin"><span class="mark">W</span><span>WuWa Builder <small style="display:block;color:#94a3b8;font-size:9px;font-weight:500">محرر المشاركات</small></span></a>
<div class="top-actions"><button id="preview-btn" class="btn"><i class="fa-regular fa-eye"></i> معاينة</button><button id="save-draft" class="btn"><i class="fa-regular fa-floppy-disk"></i> حفظ كمسودة</button><button id="publish-btn" class="btn primary"><i class="fa-solid fa-paper-plane"></i> نشر</button><a class="btn" href="/admin"><i class="fa-solid fa-xmark"></i> إغلاق</a></div></header>
<main class="layout"><section class="compose">
<input id="title" class="title-input" maxlength="180" placeholder="عنوان المشاركة" autocomplete="off">
<div class="toolbar" role="toolbar" aria-label="أدوات تنسيق المشاركة">
<button class="tool" data-cmd="bold" title="عريض"><i class="fa-solid fa-bold"></i></button><button class="tool" data-cmd="italic" title="مائل"><i class="fa-solid fa-italic"></i></button><button class="tool" data-cmd="underline" title="تحته خط"><i class="fa-solid fa-underline"></i></button><button class="tool" data-cmd="strikeThrough" title="يتوسطه خط"><i class="fa-solid fa-strikethrough"></i></button><span class="divider"></span>
<select id="block-format" class="btn" aria-label="نوع النص"><option value="p">فقرة</option><option value="h1">عنوان 1</option><option value="h2">عنوان 2</option><option value="h3">عنوان 3</option><option value="blockquote">اقتباس</option><option value="pre">نص منسق</option></select>
<button class="tool" data-cmd="insertUnorderedList" title="قائمة نقطية"><i class="fa-solid fa-list-ul"></i></button><button class="tool" data-cmd="insertOrderedList" title="قائمة مرقمة"><i class="fa-solid fa-list-ol"></i></button><span class="divider"></span>
<button class="tool" data-cmd="justifyRight" title="محاذاة لليمين"><i class="fa-solid fa-align-right"></i></button><button class="tool" data-cmd="justifyCenter" title="توسيط"><i class="fa-solid fa-align-center"></i></button><button class="tool" data-cmd="justifyLeft" title="محاذاة لليسار"><i class="fa-solid fa-align-left"></i></button><span class="divider"></span>
<button class="tool" id="link-btn" title="إضافة رابط"><i class="fa-solid fa-link"></i></button><button class="tool" id="image-btn" title="إضافة صورة"><i class="fa-regular fa-image"></i></button><button class="tool" id="table-btn" title="إضافة جدول"><i class="fa-solid fa-table"></i></button><button class="tool" data-cmd="undo" title="تراجع"><i class="fa-solid fa-rotate-left"></i></button><button class="tool" data-cmd="redo" title="إعادة"><i class="fa-solid fa-rotate-right"></i></button><span class="divider"></span><button class="btn" id="html-toggle">HTML</button>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
</div>
<div id="editor" class="editor" contenteditable="true" spellcheck="true" data-placeholder="ابدأ كتابة مشاركتك هنا…"></div><textarea id="html-source" class="html-source hidden" spellcheck="false"></textarea><div class="word-count" id="word-count">0 كلمة</div><p id="message" class="message" aria-live="polite"></p>
</section>
<aside class="side">
<section class="card"><h2 class="card-head"><i class="fa-solid fa-sliders"></i> إعدادات المشاركة</h2><p class="status" id="status">مشاركة جديدة · مسودة</p>
<label class="field">التصنيفات<input id="labels" placeholder="أخبار، أدلة، تحديثات"><span class="hint">افصل بين التصنيفات بفواصل.</span></label>
<label class="field">الرابط المختصر<input id="slug" placeholder="my-new-post" dir="ltr"><span class="hint">أحرف إنجليزية صغيرة وأرقام وشرطات فقط.</span></label>
<label class="field">ملخص المشاركة<textarea id="excerpt" rows="4" placeholder="ملخص موجز يظهر عند عرض المشاركة"></textarea></label>
<div class="hint">تُحفظ الصور المرفوعة في مكتبة وسائط الموقع. يمكنك أيضاً إدراج رابط صورة.</div></section>
<section class="card"><h2 class="card-head"><i class="fa-regular fa-lightbulb"></i> اختصارات لوحة المفاتيح</h2><div class="hint">Ctrl + B للنص العريض<br>Ctrl + I للنص المائل<br>Ctrl + K لإضافة رابط<br>Ctrl + Z للتراجع</div></section>
</aside></main>
<div id="preview-overlay" class="overlay hidden"><article class="preview"><div style="display:flex;justify-content:space-between;align-items:center"><b>معاينة المشاركة</b><button class="btn" id="close-preview">إغلاق</button></div><h1 id="preview-title"></h1><div id="preview-body" class="preview-body"></div></article></div>
<script>
const db=window.wuwaSupabase,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),postId=params.get("id");let row=null,htmlMode=false;
function msg(t,e=false){$("message").textContent=t;$("message").classList.toggle("error",e)}
function slugify(v){return v.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"")}
function bodyHtml(){return htmlMode?$("html-source").value:$("editor").innerHTML}
function syncMode(){if(htmlMode){$("html-source").value=$("editor").innerHTML;$("editor").classList.add("hidden");$("html-source").classList.remove("hidden");$("html-toggle").classList.add("active")}else{$("editor").innerHTML=$("html-source").value;$("html-source").classList.add("hidden");$("editor").classList.remove("hidden");$("html-toggle").classList.remove("active")}}
function updateCount(){const t=$("editor").innerText||$("html-source").value.replace(/<[^>]*>/g," ");$("word-count").textContent=(t.trim()?t.trim().split(/\s+/).length:0)+" كلمة"}
function exec(cmd,val=null){if(htmlMode)return msg("انتقل إلى وضع الكتابة لاستخدام أدوات التنسيق.",true);$("editor").focus();document.execCommand(cmd,false,val);updateCount()}
async function boot(){if(!db){msg("تعذر الاتصال بقاعدة البيانات.",true);return}const {data}=await db.auth.getSession();if(!data.session){location.href="/admin";return}const {data:admin,error}=await db.rpc("is_site_admin");if(error||!admin){location.href="/admin";return}if(postId){const {data:r,error:e}=await db.from("site_content").select("*").eq("id",postId).maybeSingle();if(e||!r||r.content?.cmsType!=="post"){msg("تعذر العثور على المشاركة.",true);return}row=r;$("title").value=r.title;$("slug").value=(r.slug||"").replace(/^post-/,"");$("labels").value=(r.content.labels||[]).join(", ");$("excerpt").value=r.content.excerpt||"";$("editor").innerHTML=r.content.body||"";$("status").textContent=r.published?"مشاركة منشورة":"مسودة محفوظة";document.title="تعديل المشاركة · WuWa Builder"}else{$("status").textContent="مشاركة جديدة · مسودة";$("slug").value=""}updateCount()}
async function save(publish){const title=$("title").value.trim(),body=bodyHtml().trim(),slug=slugify($("slug").value||title);if(!title)return msg("اكتب عنوان المشاركة أولاً.",true);if(!body||body==="<br>")return msg("أضف محتوى المشاركة قبل الحفظ.",true);if(!slug)return msg("اكتب رابطاً مختصراً صالحاً.",true);const content={cmsType:"post",body,excerpt:$("excerpt").value.trim(),labels:$("labels").value.split(",").map(x=>x.trim()).filter(Boolean)};const payload={slug:"post-"+slug,title,content,published:publish,updated_at:new Date().toISOString()};const buttons=[$("save-draft"),$("publish-btn")];buttons.forEach(b=>b.disabled=true);msg(publish?"جارٍ نشر المشاركة…":"جارٍ حفظ المسودة…");try{let q=row?db.from("site_content").update(payload).eq("id",row.id).select().single():db.from("site_content").insert(payload).select().single();const {data,error}=await q;if(error)throw error;row=data;history.replaceState({}, "", "?id="+encodeURIComponent(data.id));$("status").textContent=publish?"مشاركة منشورة":"مسودة محفوظة";msg(publish?"تم نشر المشاركة بنجاح.":"تم حفظ المسودة بنجاح.");document.title="تعديل المشاركة · WuWa Builder"}catch(e){msg("تعذر الحفظ: "+e.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}
document.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("click",()=>exec(b.dataset.cmd)));
$("block-format").addEventListener("change",e=>exec("formatBlock","<"+e.target.value+">"));
$("link-btn").addEventListener("click",()=>{const url=prompt("أدخل رابط الصفحة (https://...)");if(url&&/^https?:\/\//i.test(url))exec("createLink",url);else if(url)msg("يجب أن يبدأ الرابط بـ http:// أو https://",true)});
$("image-btn").addEventListener("click",()=>{if(htmlMode)return msg("انتقل إلى وضع الكتابة لإضافة صورة.",true);$("image-file").click()});
$("image-file").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)return msg("حجم الصورة يجب ألا يتجاوز 5MB.",true);msg("جارٍ رفع الصورة…");const path=Date.now()+"-"+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");const {error}=await db.storage.from("site-media").upload(path,file,{cacheControl:"3600",upsert:false});if(error)return msg("فشل رفع الصورة: "+error.message,true);const {data}=db.storage.from("site-media").getPublicUrl(path);exec("insertImage",data.publicUrl);msg("تم رفع الصورة وإدراجها.");e.target.value=""});
$("table-btn").addEventListener("click",()=>{const rows=Math.max(1,Math.min(10,Number(prompt("عدد صفوف الجدول؟","2"))||2)),cols=Math.max(1,Math.min(8,Number(prompt("عدد الأعمدة؟","2"))||2));let h="<table><tbody>";for(let r=0;r<rows;r++){h+="<tr>";for(let c=0;c<cols;c++)h+="<td><br></td>";h+="</tr>"}h+="</tbody></table><p><br></p>";exec("insertHTML",h)});
$("html-toggle").addEventListener("click",()=>{htmlMode=!htmlMode;syncMode();updateCount()});
$("editor").addEventListener("input",updateCount);$("html-source").addEventListener("input",updateCount);
$("title").addEventListener("input",()=>{if(!$("slug").dataset.touched)$("slug").value=slugify($("title").value)});
$("slug").addEventListener("input",()=>$("slug").dataset.touched="1");
$("save-draft").addEventListener("click",()=>save(false));$("publish-btn").addEventListener("click",()=>save(true));
$("preview-btn").addEventListener("click",()=>{$("preview-title").textContent=$("title").value||"بدون عنوان";$("preview-body").innerHTML=bodyHtml();$("preview-overlay").classList.remove("hidden")});
$("close-preview").addEventListener("click",()=>$("preview-overlay").classList.add("hidden"));$("preview-overlay").addEventListener("click",e=>{if(e.target===$("preview-overlay"))$("preview-overlay").classList.add("hidden")});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save(false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"&&!htmlMode){e.preventDefault();$("link-btn").click()}});
boot();
</script></body></html>
